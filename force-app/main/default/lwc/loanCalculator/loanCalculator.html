<template>
    <lightning-card
        title="Loan Calculator"
        icon-name="standard:calibration">

        <div class="slds-p-around_medium">

            <lightning-input
                type="number"
                name="loanAmount"
                label="Loan Amount (₹)"
                value={loanAmount}
                min="1"
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="number"
                name="interestRate"
                label="Interest Rate (%)"
                value={interestRate}
                min="0"
                step="0.01"
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="number"
                name="tenure"
                label="Tenure (Months)"
                value={tenure}
                min="1"
                onchange={handleChange}>
            </lightning-input>

            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div class="result-box">
                        <p>Monthly EMI</p>
                        <strong>{formattedEmi}</strong>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div class="result-box">
                        <p>Total Interest</p>
                        <strong>{formattedInterest}</strong>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <div class="result-box">
                        <p>Total Payable</p>
                        <strong>{formattedPayable}</strong>
                    </div>
                </div>

            </div>

        </div>

    </lightning-card>
</template>
