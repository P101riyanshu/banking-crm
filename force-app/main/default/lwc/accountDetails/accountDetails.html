<template>
    <lightning-Card title="Account Detail" icon-name="Standard:account">

        <!--button action-->
        <div slot="action">
        <lightning-button label="Edit account" varient="neutral"></lightning-button>
        </div>

        <div class="slds-p-horizontal_small">

            <lightning-record-view-form record-id={recordId} object-api-name="Account">
                <div class="slds-p-horizontal_small">
                    <lightning-output-field field-name="Name"></lightning-output-field>
                    <lightning-output-field field-name="AccountNumber"></lightning-output-field>
                    <lightning-output-field field-name="AnnualRevenue"></lightning-output-field>
                    <lightning-output-field field-name="Industry"></lightning-output-field>
                </div>
                <div slot="footer">
                    <span class="slds-p-horizontal_small">load All Data From Client Side</span>
                </div>
            </lightning-record-view-form>
        </div>
    </lightning-Card>
</template>
