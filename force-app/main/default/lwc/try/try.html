<template>
    <lightning-quick-action-panel header="Create Bank Account">

        <lightning-record-edit-form
            object-api-name="Bank_Account__c"
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            onerror={handleError}>

            <lightning-messages></lightning-messages>

            <lightning-input-field
                field-name="Name">
            </lightning-input-field>

            <lightning-input-field
                field-name="Account_Type__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Account_Number__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Balance__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Opening_Date__c">
            </lightning-input-field>

            <lightning-input-field
                field-name="Account_Status__c">
            </lightning-input-field>

            <div slot="footer">

                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    type="submit"
                    label="Create Account">
                </lightning-button>

            </div>

        </lightning-record-edit-form>

    </lightning-quick-action-panel>
</template>
